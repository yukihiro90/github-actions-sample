name: Set End Date on Done

on:
  issues:
    types: [edited, closed]

jobs:
  update-end-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue is moved to Done and set end_date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueId = context.payload.issue?.node_id || context.payload.pull_request?.node_id;
            console.log('issueId', issueId);
            if (!issueId) return;

            const projectId = 'PVT_kwHOAIMzxs4A9Ip5'; // プロジェクトID
            const doneStatusId = '98236657'; // 「Done」ステータスのID

            const { data: projects } = await github.graphql(`
              query {
                node(id: "${issueId}") {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        fieldValues(first: 10) {
                          nodes {
                            field {
                              name
                            }
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              optionId
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `);

            const item = projects.node.projectItems.nodes[0];
            const statusField = item.fieldValues.nodes.find(f => f.field.name === "Status");

            if (statusField?.optionId !== doneStatusId) return;

            const today = new Date().toISOString().split('T')[0];

            await github.graphql(`
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: "${projectId}",
                  itemId: "${item.id}",
                  fieldId: "PVTF_lAHOAIMzxs4A9Ip5zgw7Zf4",  // end_dateのフィールドID
                  value: { date: "${today}" }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `);
