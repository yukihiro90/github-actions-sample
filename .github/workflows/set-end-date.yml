name: Set End Date on Done

on:
  issues:
    types: [edited, closed]

jobs:
  update-end-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue is moved to Done and set end_date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            const issueId = context.payload.issue?.node_id || context.payload.pull_request?.node_id;
            if (!issueId) return;

            const projectId = 'PVT_kwHOAIMzxs4A9Ip5'; // プロジェクトID
            const doneStatusId = '98236657'; // 「Done」ステータスのID


            const today = new Date().toISOString().split('T')[0];

            await github.graphql(`
              mutation {
                updateProjectV2ItemFieldValue(input: {
                  projectId: "${projectId}",
                  itemId: "PVTI_lAHOAIMzxs4A9Ip5zgcRNFo",
                  fieldId: "PVTF_lAHOAIMzxs4A9Ip5zgw7Zf4",
                  value: { date: "${today}" }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `);
