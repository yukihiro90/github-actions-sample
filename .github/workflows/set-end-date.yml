name: Set End Date on Done

on:
  issues:
    types: [edited, closed]

jobs:
  update-end-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue is moved to Done and set end_date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueId = context.payload.issue?.node_id || context.payload.pull_request?.node_id;
            if (!issueId) return;

            const projectId = 'PVT_kwHOAIMzxs4A9Ip5'; // プロジェクトID
            const doneStatusId = '98236657'; // 「Done」ステータスのID

            const query = `
              query {
                node(id: "${issueId}") {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id,
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            console.log(query);

            const issue = await github.graphql(query);
            console.log(issue);

            const projects = issue.data.node.projectItems.nodes;

            console.log(projects);
